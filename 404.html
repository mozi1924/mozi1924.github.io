<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Mozi's Open Source Hub...</title>
  <meta http-equiv="refresh" content="0; url=https://hub.mozi1924.com" />
  <link rel="canonical" href="https://hub.mozi1924.com" />
  <meta name="robots" content="noindex, follow" />
  <script>
    (function() {
      var target = "https://hub.mozi1924.com" + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #3f89fc;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-family: monospace;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #3f89fc;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .spinner {
      margin: 1.25rem auto 0;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(63, 137, 252, 0.2);
      border-top-color: #3f89fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MOZI ARASAKA</div>
    <h1>Open Source Hub Has Moved</h1>
    <p>We have upgraded our infrastructure. You are being redirected to our high-performance Cloudflare edge portal.</p>
    <a href="https://hub.mozi1924.com" class="btn" id="redirect-link">Go to hub.mozi1924.com</a>
    <div class="spinner"></div>
  </div>
  <script>
    var link = document.getElementById("redirect-link");
    if (link) {
      link.href = "https://hub.mozi1924.com" + window.location.pathname + window.location.search + window.location.hash;
    }
  </script>
</body>
</html>
